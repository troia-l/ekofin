<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <radialGradient id="gradTam" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </radialGradient>
    <radialGradient id="gradSam" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </radialGradient>
    <radialGradient id="gradSom" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#34D399"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="450" y="46" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#064E3B">Pazar Fırsatı: TAM / SAM / SOM</text>
  <text x="450" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#475569">EkoFin'in hedeflediği küresel ESG yazılım pazarı ve Türkiye KOBİ segmenti</text>

  <!-- Circles -->
  <circle cx="300" cy="330" r="230" fill="url(#gradTam)" filter="url(#shadow)"/>
  <circle cx="300" cy="330" r="160" fill="url(#gradSam)" filter="url(#shadow)"/>
  <circle cx="300" cy="330" r="90" fill="url(#gradSom)" filter="url(#shadow)"/>

  <!-- TAM Label -->
  <text x="300" y="175" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="2" opacity="0.9">TAM</text>
  <text x="300" y="205" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="white">$283M</text>
  <text x="300" y="228" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="white" opacity="0.85">/ yıl · 11.9 Milyar TL</text>

  <!-- SAM Label -->
  <text x="300" y="250" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="white" letter-spacing="2" opacity="0.9">SAM</text>
  <text x="300" y="278" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="white">$54M</text>
  <text x="300" y="298" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="white" opacity="0.85">/ yıl · 2.26 Milyar TL</text>

  <!-- SOM Label -->
  <text x="300" y="315" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="white" letter-spacing="2" opacity="0.9">SOM</text>
  <text x="300" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="white">$1.6M</text>
  <text x="300" y="358" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="white" opacity="0.85">/ yıl · 68 Milyon TL</text>

  <!-- Legend Cards -->
  <g transform="translate(580, 140)">
    <!-- TAM Card -->
    <rect x="0" y="0" width="280" height="110" rx="14" fill="#F1F5F9"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="#064E3B"/>
    <circle cx="26" cy="26" r="7" fill="#064E3B"/>
    <text x="42" y="31" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0F172A">TAM — Total Addressable Market</text>
    <text x="14" y="58" font-family="Inter, sans-serif" font-size="11" fill="#475569">Küresel ESG yazılım pazarına Türkiye payı.</text>
    <text x="14" y="78" font-family="Inter, sans-serif" font-size="11" fill="#475569">2034'te $5.2–7.4B büyüme öngörüsü.</text>
    <text x="14" y="100" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#0F172A">$283M/yıl</text>

    <!-- SAM Card -->
    <rect x="0" y="130" width="280" height="110" rx="14" fill="#F1F5F9"/>
    <rect x="0" y="130" width="6" height="110" rx="3" fill="#10B981"/>
    <circle cx="26" cy="156" r="7" fill="#10B981"/>
    <text x="42" y="161" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0F172A">SAM — Serviceable Addressable Market</text>
    <text x="14" y="188" font-family="Inter, sans-serif" font-size="11" fill="#475569">Türkiye'de ulaşılabilir KOBİ + banka segmenti.</text>
    <text x="14" y="208" font-family="Inter, sans-serif" font-size="11" fill="#475569">3.7M+ girişim ve 181K imalat şirketinden daraltılmış.</text>
    <text x="14" y="230" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#0F172A">$54M/yıl</text>

    <!-- SOM Card -->
    <rect x="0" y="260" width="280" height="110" rx="14" fill="#F1F5F9"/>
    <rect x="0" y="260" width="6" height="110" rx="3" fill="#34D399"/>
    <circle cx="26" cy="286" r="7" fill="#34D399"/>
    <text x="42" y="291" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0F172A">SOM — Serviceable Obtainable Market</text>
    <text x="14" y="318" font-family="Inter, sans-serif" font-size="11" fill="#475569">İlk 3 yılda gerçekçi hedef.</text>
    <text x="14" y="338" font-family="Inter, sans-serif" font-size="11" fill="#475569">%3 SAM penetrasyonu, banka API + KOBİ SaaS.</text>
    <text x="14" y="360" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#0F172A">$1.6M/yıl</text>
  </g>

  <!-- Growth Drivers -->
  <g transform="translate(80, 520)">
    <rect x="0" y="0" width="170" height="44" rx="10" fill="#E0F2FE"/>
    <text x="85" y="27" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">CSRD / TSRS Regülasyonu</text>

    <rect x="190" y="0" width="150" height="44" rx="10" fill="#E0F2FE"/>
    <text x="265" y="27" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">SKDM / CBAM Baskısı</text>

    <rect x="360" y="0" width="150" height="44" rx="10" fill="#E0F2FE"/>
    <text x="435" y="27" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">Yeşil Kredi Talebi</text>

    <rect x="530" y="0" width="170" height="44" rx="10" fill="#E0F2FE"/>
    <text x="615" y="27" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">Yatırımcı ESG Baskısı</text>
  </g>

  <!-- Footer -->
  <text x="450" y="590" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">Kaynak: TÜİK 2024, Emergen Research ESG Reporting Software Market, EkoFin iç pazar modellemesi.</text>
</svg>
